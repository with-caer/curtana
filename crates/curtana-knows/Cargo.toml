[package]
name = "curtana-knows"
description = "Knowledge embedding, storage, and retrieval tools."
version = "0.1.0"
edition.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# Data encoding.
codas = { version = "0.7.0", features = ["serde"] }
codas-flow = { version = "0.7.0" }
codas-macros = { version = "0.7.0", features = ["serde"] }

# Persistence.
duckdb = { version = "1.2.2", features = ["bundled"] }

# LLM inference (for embedding).
curtana-infers = { workspace = true }

# Manifest persistence.
toml = "0.8.22"

# Serialization (required by codas-macros generated code).
serde = { workspace = true }

# JSON parsing for tool arguments.
serde_json = "1"

# Async runtime.
tokio = { workspace = true }

# Logging.
tracing = { workspace = true }
